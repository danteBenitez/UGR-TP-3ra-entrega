[project]
name = "ugr-tp-3ra-entrega"
version = "0.1.0"
description = "Variación de la demanda en el Subte de CABA (Líneas A, B y C): preprocesamiento, EDA y validación estadística (2014–2019)"
readme = "README.md"
authors = [
    { name = "danteBenitez", email = "benitezdante123@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "holidays>=0.25",
    "ipykernel>=7.4.0",
    "matplotlib>=3.7.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "pyarrow>=12.0.0",
    "scipy>=1.10.0",
    "seaborn>=0.12.0",
    "tabulate>=0.9.0",
    "xgboost-cpu>=3.4.1",
]

[tool.uv]
# Proyecto de análisis (notebook), no un paquete instalable.
package = false

[dependency-groups]
dev = [
    "nbconvert>=7.17.2",
]
